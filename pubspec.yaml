name: vernet
description: A simple way to understand and check your internet connection

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.4.2+59

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  # Automatically resizes text to fit perfectly within its bounds.
  auto_size_text: ^3.0.0
  # Helps implement the BLoC pattern.
  bloc: ^9.2.1
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  dart_ping: ^10.0.1
  # Remove git url and use pub version once fix is available in source. 
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  external_app_launcher: ^4.0.4
  flutter:
    sdk: flutter
  # Bloc for state management, replace StatefulWidget
  flutter_bloc: ^9.1.1
  # A cross platform plugin for displaying local notifications.
  flutter_local_notifications: ^22.3.0
  # A versatile mapping package for Flutter
  flutter_map: ^8.3.2
  # A Dart implementation of Leaflet.makercluster for Flutter apps
  flutter_map_marker_cluster_plus: ^1.4.2
  # Native splash screen plugin
  flutter_native_splash: ^2.4.8
  # A simple yet fully customizable rating bar for flutter
  flutter_rating_bar: ^4.0.1
  # A flutter plugin for getting the local timezone of the OS.
  flutter_timezone: ^5.1.1
  # Annotations for freezed
  freezed_annotation: ^3.1.0
  # Service locator
  get_it: ^9.3.0
  # A composable, multi-platform, Future-based API for HTTP requests.
  http: ^1.6.0
  # Convenient code generator for get_it
  injectable: ^3.0.0
  # An easy way to create a new isolate, keep it running and communicate with it.
  isolate_contactor: ^4.1.0
  # Discover network info and configure themselves accordingly
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  network_info_plus: ^8.2.2
  # Helps you discover open ports, devices on subnet and more.
  network_tools_flutter: ^3.0.5
  # Querying information about the application package, such as CFBundleVersion
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  # Allows you to display progress widgets based on percentage.
  percent_indicator: ^4.2.5
  # Popup that ask for the requested permission
  permission_handler: ^13.0.2
  # A wrapper around InheritedWidget to make them easier to use and more reusable.
  provider: ^6.1.5
  # RxDart extends the capabilities of Dart Streams and StreamControllers.
  rxdart: ^0.26.0
  # Reading and writing simple key-value pairs
  shared_preferences: ^2.5.6
  # Multiplatform safe UI Canvas Asset
  signal_strength_indicator: ^0.5.0
  # Flutter package to test ping, upload, download using speedtest.net
  speed_test_dart:
    git:
      url: https://github.com/git-elliot/speed_test_dart.git
      ref: master # branch name
  # A little widget that given an Observable gives you an updated SpeedOMeter.
  speedometer: ^1.2.2
  sqlite3: ^3.4.0
  syncfusion_flutter_gauges: ^34.2.6
  # Time zone database and time zone aware DateTime.
  timezone: ^0.11.1
  # Plugin for launching a URL
  url_launcher: ^6.3.2
  wake_on_lan: ^4.1.1+3
  # Windows Specific Application Handlers
  wifi_plus: ^0.0.2
  # Mobile Specific Compilation Handlers
  wifi_signal_strength_indicator: ^1.0.7

dev_dependencies:
  # A build system for Dart code generation and modular compilation.
  build_runner: ^2.4.9

  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  # Code generator for unions/pattern-matching/copy.
  freezed: ^4.0.2
  # Convenient code generator for get_it.
  injectable_generator: ^3.1.1
  integration_test:
    sdk: flutter
  # Collection of lint rules for Dart and Flutter projects.
  json_serializable: ^6.13.1
  lint: ^2.14.0
  mocktail: ^1.0.5
  msix: ^3.18.0

dependency_overrides:
  flutter_isolate:
    git:
      url: https://github.com/git-elliot/flutter_isolate.git
      ref: 95983262e86d34a24b699a878ee5b965ae0743db

msix_config:
  store: true
  display_name: Vernet App
  publisher_display_name: Open Society
  identity_name: OpenSociety.VernetApp
  publisher: CN=89BA02CB-9308-4756-8038-C5914BBAE367
  msix_version: 1.0.0.1
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient, location

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/ports_lists.json
    - assets/app_icon.png
    - assets/splash11/splash_light/ic_launcher_round.png
    - assets/splash11/splash_dark/ic_launcher_round.png

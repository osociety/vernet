name: Play Store release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play release track
        type: choice
        options:
          - beta
          - production
        default: beta
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: play-store-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  store-branch-check:
    name: Require store branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/store" ]]; then
            echo "This workflow must be dispatched from the store branch."
            exit 1
          fi

  checks:
    name: Run analyzer and unit tests
    needs: store-branch-check
    uses: ./.github/workflows/flutter_unit_test.yml


  android-integration:
    name: Run Android integration test
    needs: store-branch-check
    uses: ./.github/workflows/android-integration-test.yml

  publish:
    name: Build and publish to Google Play
    needs: [checks, android-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          java_version: '17'

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2.4
        with:
          fileName: key.jks
          encodedString: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" >> android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

      - name: Build Android App Bundle
        run: flutter build appbundle --flavor store

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.221.0
        with:
          ruby-version: 3.4.2

      - name: Cache bundle dependencies
        uses: actions/cache@v4.2.2
        with:
          path: android/vendor/bundle
          key: '${{ runner.os }}-gems-${{ hashFiles(''**/Gemfile.lock'') }}'
          restore-keys: '${{ runner.os }}-gems-'

      - name: Install bundle dependencies
        working-directory: android/
        run: |
          gem install bundler
          bundle config path vendor/bundle
          bundle install

      - name: Release to Google Play
        env:
          SUPPLY_PACKAGE_NAME: '${{ secrets.ANDROID_PACKAGE_NAME }}'
          SUPPLY_JSON_KEY_DATA: '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}'
        working-directory: android/
        run: bundle exec fastlane android ${{ inputs.track == 'beta' && 'beta' || 'deploy_full' }}
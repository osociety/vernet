name: Flutter release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build
        required: true
        type: string
    
permissions:
  contents: write

env:
  ANDROID_BUILD_PATH: ${{ vars.ANDROID_BUILD_PATH }}
  LINUX_BUILD_PATH: ${{ vars.LINUX_BUILD_PATH }}
  MACOS_BUILD_PATH: ${{ vars.MACOS_BUILD_PATH }}
  WINDOWS_BUILD_PATH: ${{ vars.WINDOWS_BUILD_PATH }}
  MACOS_DMG_PATH: installers/dmg_creator

jobs:
  release-approval:
    name: Approve release promotion
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Confirm release promotion
        run: echo "Approved release promotion for ${{ env.RELEASE_TAG }}"

  create-tag:
    name: Create or verify pubspec release tag
    runs-on: ubuntu-latest
    needs: release-approval
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create tag from pubspec version if needed
        run: |
          set -euo pipefail

          if [[ -n "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")" ]]; then
            exit 0
          fi

          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$/\1/p' pubspec.yaml)"
          if [[ "v${version}" != "$RELEASE_TAG" ]]; then
            echo "::error::Release tag must match pubspec.yaml (expected v${version})."
            exit 1
          fi

          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

  create-release:
    name: Create or reuse GitHub Release
    runs-on: ubuntu-latest
    needs: create-tag
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Create release with Fastlane changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          build_number="$(sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' pubspec.yaml)"
          changelog="android/fastlane/metadata/android/en-US/changelogs/${build_number}.txt"
          if [[ -z "$build_number" || ! -s "$changelog" ]]; then
            echo "::error::Could not find the Fastlane changelog for ${RELEASE_TAG}."
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Vernet ${RELEASE_TAG}" \
              --notes-file "$changelog"
          fi

  release-android-and-linux: 
    runs-on: ubuntu-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      LINUX_ZIP: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-linux.zip
      ANDROID_APK_ARM_V7A: app-armeabi-v7a-dev-release.apk
      ANDROID_APK_ARM_V8A: app-arm64-v8a-dev-release.apk
      ANDROID_APK_x86_64: app-x86_64-dev-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          java_version: '17'

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2.4
        with:
          fileName: key.jks
          encodedString: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" >> android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

      - name: Create artifacts directory
        run: mkdir -p artifacts
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build Android App and Linux Bundle
        # Use signing keys for release instead of debug
        run: |
          flutter build apk --split-per-abi --flavor dev
          flutter build linux --release

      - name: Rename ANDROID APKs
        run: |
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_ARM_V7A}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V7A}}
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_ARM_V8A}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V8A}}
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_x86_64}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_x86_64}}

      - name: Linux Archive
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ${{ env.LINUX_ZIP }}
          directory: ${{  env.LINUX_BUILD_PATH }}

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V7A}}
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V8A}}
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_x86_64}}

      - name: Publish Linux Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: ${{ env.LINUX_BUILD_PATH }}/${{ env.LINUX_ZIP }}

  release-firebase-hosting:
    name: Deploy Firebase Hosting with app release
    needs: create-release
    uses: ./.github/workflows/firebase_hosting.yml
    secrets: inherit
  
  release-macos: 
    runs-on: macos-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      MACOS_ZIP: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-macos.zip
      MACOS_DMG: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-macos.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Cache CocoaPods
        uses: actions/cache@v4.2.2
        with:
          path: macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap

      - name: Build macos release
        run: flutter build macos --release

      - name: Archive macos
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ${{ env.MACOS_ZIP }}
          directory: ${{ env.MACOS_BUILD_PATH }}

      - name: Setup Node 24
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          
      - name: Install Appdmg and Create dmg
        working-directory: ${{ env.MACOS_DMG_PATH }}
        run: |
          npm install -g appdmg
          appdmg ./config.json ./${{ env.MACOS_DMG }}

      - name: Publish macOS Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            ${{ env.MACOS_BUILD_PATH }}/${{ env.MACOS_ZIP }}
            ${{ env.MACOS_DMG_PATH }}/${{ env.MACOS_DMG }}

  release-windows:
    runs-on: windows-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      WINDOWS_ZIP: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-windows.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap

      - name: Build windows release
        run: flutter build windows --release

      - name: Archive windows Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ${{ env.WINDOWS_ZIP }}
          directory: ${{ env.WINDOWS_BUILD_PATH }}

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: ${{ env.WINDOWS_BUILD_PATH }}/${{ env.WINDOWS_ZIP }}
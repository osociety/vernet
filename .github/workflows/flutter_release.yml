name: Flutter release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build
        required: true
        type: string
    
permissions:
  contents: write
  discussions: write
  # A called reusable workflow can only narrow the permissions of its caller,
  # so this covers play_store_release.yml's download of the store bundle.
  actions: read

env:
  ANDROID_BUILD_PATH: ${{ vars.ANDROID_BUILD_PATH }}
  LINUX_BUILD_PATH: ${{ vars.LINUX_BUILD_PATH }}
  MACOS_BUILD_PATH: ${{ vars.MACOS_BUILD_PATH }}
  WINDOWS_BUILD_PATH: ${{ vars.WINDOWS_BUILD_PATH }}
  MACOS_DMG_PATH: scripts/installers/dmg_creator
  SQLITE_VERSION: 3.54.1
  SQLITE_BUILD_VERSION: 3540100

jobs:
  release-approval:
    name: Approve release promotion
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Confirm release promotion
        run: echo "Approved release promotion for ${{ env.RELEASE_TAG }}"

  create-tag:
    name: Create or verify pubspec release tag
    runs-on: ubuntu-latest
    needs: release-approval
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create tag from pubspec version if needed
        run: |
          set -euo pipefail

          if [[ -n "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")" ]]; then
            exit 0
          fi

          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$/\1/p' pubspec.yaml)"
          if [[ "v${version}" != "$RELEASE_TAG" ]]; then
            echo "::error::Release tag must match pubspec.yaml (expected v${version})."
            exit 1
          fi

          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

  create-release:
    name: Create or reuse GitHub Release
    runs-on: ubuntu-latest
    needs: create-tag
    permissions:
      contents: write
      discussions: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Create release with Fastlane changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          build_number="$(sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' pubspec.yaml)"
          changelog="android/fastlane/metadata/android/en-US/changelogs/${build_number}.txt"
          if [[ -z "$build_number" || ! -s "$changelog" ]]; then
            echo "::error::Could not find the Fastlane changelog for ${RELEASE_TAG}."
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Vernet ${RELEASE_TAG}" \
              --notes-file "$changelog" \
              --prerelease
          fi

      - name: Read changelog
        id: changelog
        run: |
          build_number="$(sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' pubspec.yaml)"
          changelog_file="android/fastlane/metadata/android/en-US/changelogs/${build_number}.txt"
          if [[ -f "$changelog_file" ]]; then
            {
              echo "body<<CHANGELOG_EOF"
              cat "$changelog_file"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=See release notes." >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing release discussion
        id: discussion_check
        if: vars.REPOSITORY_ID != '' && vars.DISCUSSION_CATEGORY_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_CATEGORY_ID: ${{ vars.DISCUSSION_CATEGORY_ID }}
          DISCUSSION_TITLE: "Vernet ${{ env.RELEASE_TAG }}"
        run: |
          set -uo pipefail
          titles="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$category:ID!){repository(owner:$owner,name:$name){discussions(first:50,categoryId:$category){nodes{title}}}}' \
              -f owner="${GITHUB_REPOSITORY_OWNER}" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -f category="${DISCUSSION_CATEGORY_ID}" \
              --jq '.data.repository.discussions.nodes[].title' 2>/dev/null || true
          )"
          if printf '%s\n' "$titles" | grep -qFx "$DISCUSSION_TITLE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release discussion
        if: >-
          vars.REPOSITORY_ID != '' && vars.DISCUSSION_CATEGORY_ID != '' &&
          steps.discussion_check.outputs.exists != 'true'
        uses: abirismyname/create-discussion@v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository-id: ${{ vars.REPOSITORY_ID }}
          category-id: ${{ vars.DISCUSSION_CATEGORY_ID }}
          title: "Vernet ${{ env.RELEASE_TAG }}"
          body: |
            ## What's new in ${{ env.RELEASE_TAG }}

            ${{ steps.changelog.outputs.body }}

            Download from the [release page](https://github.com/osociety/vernet/releases/tag/${{ env.RELEASE_TAG }}).

  release-android: 
    runs-on: ubuntu-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      ANDROID_APK_ARM_V7A: app-armeabi-v7a-dev-release.apk
      ANDROID_APK_ARM_V8A: app-arm64-v8a-dev-release.apk
      ANDROID_APK_x86_64: app-x86_64-dev-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          java_version: '17'

      - name: Cache Android SDK 37
        id: cache-android-sdk
        uses: actions/cache@v4.2.2
        with:
          path: ${{ env.ANDROID_HOME }}/platforms/android-37.0
          key: ${{ runner.os }}-android-sdk-37

      - name: Install Android SDK 37
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Link Android SDK platform
        run: ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Disable Gradle file-system watching
        run: echo "org.gradle.vfs.watch=false" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2.4
        with:
          fileName: key.jks
          encodedString: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" >> android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

      - name: Create artifacts directory
        run: mkdir -p artifacts
      
      - name: Build Android App and Linux Bundle
        # Use signing keys for release instead of debug
        run: |
          flutter build apk --split-per-abi --flavor dev

      - name: Rename ANDROID APKs
        run: |
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_ARM_V7A}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V7A}}
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_ARM_V8A}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V8A}}
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_x86_64}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_x86_64}}

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V7A}}
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V8A}}
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_x86_64}}

      # Last, so the ad-free APKs above are built from the committed tree and
      # nothing downstream in this job reads a pubspec the overlay touched.
      - name: Build the store app bundle
        run: dart run scripts/build_store.dart

      - name: Confirm the overlay did not leak
        run: |
          set -euo pipefail
          git diff --exit-code pubspec.yaml pubspec.lock lib/store
          if grep -q google_mobile_ads pubspec.yaml; then
            echo "::error::pubspec.yaml still declares the ad SDK. F-Droid builds this file."
            exit 1
          fi

      - name: Upload store bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: store-bundle
          path: build/app/outputs/bundle/storeRelease/app-store-release.aab
          if-no-files-found: error
          # Kept longer than the snap so a later track rollout can still reuse
          # this exact, already tested bundle.
          retention-days: 14

  release-linux:
    name: Build Linux ${{ matrix.architecture }} packages
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
            deb_arch: x86_64-linux-gnu
          - architecture: arm64
            runner: ubuntu-24.04-arm
            deb_arch: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      LINUX_ZIP: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-linux-${{ matrix.architecture }}.zip
      LINUX_BUILD_PATH: build/linux/${{ matrix.architecture }}/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          architecture: ${{ matrix.architecture }}

      - name: Create artifacts directory
        run: mkdir -p artifacts
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsqlite3-0 clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build Linux Bundle
        run: |
          flutter build linux --release

      # The copy has to come after the build. `flutter build linux` runs
      # `ninja install`, and linux/CMakeLists.txt opens with
      # `file(REMOVE_RECURSE "${BUILD_BUNDLE_DIR}/")`, so a library dropped into
      # the bundle beforehand is deleted before the zip is made. Released
      # zips therefore had no libsqlite3.so and Drift threw on the first
      # database open. snap/snapcraft.yaml copies after building for the
      # same reason, and the Windows job copies sqlite3.dll after building.
      #
      # Both names are staged: package:sqlite3 3.9.0 dlopens the unversioned
      # `libsqlite3.so` (that is the name in the crash), while the system's
      # unversioned entry is only a -dev symlink, so it is dereferenced with -L
      # into a real file. `libsqlite3.so.0` is the SONAME and covers a runtime
      # that asks for it instead.
      - name: Copy sqlite3 library into the bundle
        run: |
          system_lib="/usr/lib/${{ matrix.deb_arch }}/libsqlite3.so.0"
          if [ ! -f "$system_lib" ]; then
            echo "::error::$system_lib is missing. libsqlite3-0 provides it."
            exit 1
          fi
          bundle_lib="${{ env.LINUX_BUILD_PATH }}/lib"
          mkdir -p "$bundle_lib"
          cp -L "$system_lib" "$bundle_lib/libsqlite3.so.0"
          cp -L "$system_lib" "$bundle_lib/libsqlite3.so"

      - name: Linux Archive
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ${{ env.LINUX_ZIP }}
          directory: ${{  env.LINUX_BUILD_PATH }}

      # The Linux integration leg runs against the runner's system sqlite3, so
      # nothing else in CI notices a bundle that cannot open its database. This
      # asserts the shipped archive, not the directory it was made from.
      - name: Verify the archive is self-contained
        run: |
          archive="${{ env.LINUX_BUILD_PATH }}/${{ env.LINUX_ZIP }}"
          contents="$(unzip -Z1 "$archive")"
          check() {
            if ! printf '%s\n' "$contents" | grep -q "$1"; then
              echo "::error::$2 is missing from $archive."
              printf '%s\n' "$contents"
              exit 1
            fi
            echo "ok: $2"
          }
          check '^vernet$'              'the vernet executable'
          check '^lib/libsqlite3\.so$'  'libsqlite3.so'
          check '^lib/libsqlite3\.so\.0$' 'libsqlite3.so.0'
          check '^data/flutter_assets/'   'the bundled Flutter assets'

      # The step above only proves the archive carries the library. Whether the
      # app can resolve it is a loader question: package:sqlite3 3.x dlopens the
      # bare name `libsqlite3.so`, so a bundle that ships the file still fails
      # if nothing searches the app's own lib/ directory. Ubuntu runners have a
      # system copy that would mask that, so it is moved aside first — with a
      # rename rather than `apt remove`, which would drag reverse dependencies
      # down with it. After this, a start can only come from inside the release
      # artifact.
      - name: Smoke test the extracted archive
        run: |
          set -uo pipefail
          smoke=/tmp/vernet-smoke
          rm -rf "$smoke"
          mkdir -p "$smoke"
          unzip -q "${{ env.LINUX_BUILD_PATH }}/${{ env.LINUX_ZIP }}" -d "$smoke"

          hide=/var/tmp/vernet-hidden-sqlite
          sudo mkdir -p "$hide"
          for found in $(sudo find /usr/lib /lib -maxdepth 4 -name 'libsqlite3.so*' 2>/dev/null); do
            sudo mv "$found" "$hide/$(echo "${found//\//_}")"
          done
          sudo ldconfig
          if sudo ldconfig -p | grep -q 'libsqlite3\.so'; then
            echo "::error::libsqlite3 is still resolvable from the system, so this run could not tell the bundled copy from the distro's."
            exit 1
          fi

          sudo Xvfb -ac :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          log=/tmp/vernet-smoke.log
          cd "$smoke"
          timeout 45 ./vernet > "$log" 2>&1
          status=$?
          if grep -qi 'libsqlite3' "$log"; then
            echo "::error::the released bundle could not load its own SQLite library."
            sed -n '1,40p' "$log"
            exit 1
          fi
          # 124 is the timeout firing, which is the pass: the app stayed up.
          # Anything else means it came up and died, or never started.
          if [ "$status" -ne 124 ]; then
            echo "::error::vernet from the release archive exited with status $status."
            sed -n '1,40p' "$log"
            exit 1
          fi
          echo "Released bundle started with the distro's SQLite removed."

      - name: Publish Linux Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: ${{ env.LINUX_BUILD_PATH }}/${{ env.LINUX_ZIP }}

      - name: Build Snap
        uses: canonical/action-build@v1
        id: build

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: snap-${{ matrix.architecture }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 1

  publish-snap:
    name: Publish Snap packages to Snap Store
    runs-on: ubuntu-latest
    needs:
      - create-release
      - release-linux
    steps:
      - name: Download Snap artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: snap-*
          path: snaps
          merge-multiple: true

      - name: Locate snap files
        id: snaps
        run: |
          set -euo pipefail
          X64=$(ls snaps/*_amd64.snap | head -n 1)
          ARM64=$(ls snaps/*_arm64.snap | head -n 1)
          if [ -z "$X64" ] || [ -z "$ARM64" ]; then
            echo "Both amd64 and arm64 snaps are required." >&2
            exit 1
          fi
          echo "amd64=$X64" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"

      - name: Publish amd64 snap
        uses: canonical/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.snaps.outputs.amd64 }}
          release: beta # Change to 'stable', 'candidate', or 'beta' as needed

      - name: Publish arm64 snap
        uses: canonical/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.snaps.outputs.arm64 }}
          release: beta # Change to 'stable', 'candidate', or 'beta' as needed

  publish-play-store:
    name: Publish store bundle to Google Play
    needs:
      - create-release
      - release-android
    uses: ./.github/workflows/play_store_release.yml
    with:
      track: beta
    secrets: inherit

  release-firebase-hosting:
    name: Deploy Firebase Hosting with app release
    needs: create-release
    uses: ./.github/workflows/firebase_hosting.yml
    secrets: inherit
  
  release-macos: 
    runs-on: macos-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      MACOS_ZIP: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-macos.zip
      MACOS_DMG: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-macos.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap

      - name: Build macos release
        run: flutter build macos --release

      - name: Archive macos
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ${{ env.MACOS_ZIP }}
          directory: ${{ env.MACOS_BUILD_PATH }}

      - name: Setup Node 24
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          
      - name: Install Appdmg and Create dmg
        working-directory: ${{ env.MACOS_DMG_PATH }}
        run: |
          npm install -g appdmg
          appdmg ./config.json ./${{ env.MACOS_DMG }}

      - name: Publish macOS Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            ${{ env.MACOS_BUILD_PATH }}/${{ env.MACOS_ZIP }}
            ${{ env.MACOS_DMG_PATH }}/${{ env.MACOS_DMG }}

  release-windows:
    name: Build Windows ${{ matrix.architecture }} packages
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Flutter bootstrap
        uses: ./.github/actions/flutter-bootstrap   # adjust to your action's path
        with:
          architecture: ${{ matrix.architecture }}

      - name: Build Windows release
        run: flutter build windows --release

      - name: Cache SQLite DLL (arm64)
        if: ${{ matrix.architecture == 'arm64' }}
        id: cache-sqlite-arm64
        uses: actions/cache@v4.2.2
        with:
          path: ${{ runner.temp }}/sqlite-arm64-cache/sqlite3.dll
          key: ${{ runner.os }}-sqlite-arm64-${{ env.SQLITE_BUILD_VERSION }}

      - name: Install architecture-matched SQLite DLL and create distributables
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDirectory = "build/windows/$env:ARCHITECTURE/runner/Release"
          if (-not (Test-Path "$buildDirectory/vernet.exe")) {
            throw "Expected Windows build output was not found: $buildDirectory"
          }

          if ($env:ARCHITECTURE -eq 'x64') {
            if ([string]::IsNullOrWhiteSpace($env:SQLITE_VERSION)) {
              throw 'SQLITE_VERSION is not set.'
            }

            # Chocolatey's sqlite package publishes x86/x64 DLLs and selects
            # x64 on the windows-2022 x64 runner.
            choco install sqlite -y --version="$env:SQLITE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey failed to install SQLite.' }

            $sqliteDllPath = 'C:\ProgramData\chocolatey\lib\sqlite\tools\sqlite3.dll'
            if (-not (Test-Path $sqliteDllPath)) {
              throw "sqlite3.dll not found at $sqliteDllPath"
            }
          } else {
            # Chocolatey's package does not include an ARM64 DLL. Use the
            # matching upstream SQLite archive on the Windows ARM64 runner.
            $sqliteCacheDir = Join-Path $env:RUNNER_TEMP 'sqlite-arm64-cache'
            $sqliteCachedDll = Join-Path $sqliteCacheDir 'sqlite3.dll'
            if (Test-Path $sqliteCachedDll) {
              $sqliteDllPath = $sqliteCachedDll
            } else {
              $sqliteArchive = Join-Path $env:RUNNER_TEMP 'sqlite-arm64.zip'
              $sqliteUrl = "https://www.sqlite.org/2026/sqlite-dll-win-arm64-$env:SQLITE_BUILD_VERSION.zip"
              Invoke-WebRequest -Uri $sqliteUrl -OutFile $sqliteArchive
              $sqliteExtract = Join-Path $env:RUNNER_TEMP 'sqlite-arm64'
              Expand-Archive -Path $sqliteArchive -DestinationPath $sqliteExtract -Force
              $sqliteDll = Get-ChildItem -Path $sqliteExtract -Filter sqlite3.dll -File -Recurse | Select-Object -First 1
              if (-not $sqliteDll) { throw "sqlite3.dll was not found in $sqliteUrl" }
              New-Item -ItemType Directory -Force -Path $sqliteCacheDir | Out-Null
              Copy-Item $sqliteDll.FullName $sqliteCachedDll -Force
              $sqliteDllPath = $sqliteCachedDll
            }
          }
          if (-not (Test-Path $sqliteDllPath)) { throw "SQLite DLL was not found at $sqliteDllPath" }
          Copy-Item $sqliteDllPath "$buildDirectory/sqlite3.dll" -Force

          $storeVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$').Matches.Groups[1].Value
          if (-not $storeVersion) { throw 'Could not derive the app version from pubspec.yaml.' }
          $storeVersion = "$storeVersion.0"

          $artifactDirectory = "artifacts/$env:ARCHITECTURE"
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          $zipPath = Join-Path $artifactDirectory "Vernet-$env:RELEASE_TAG-windows-$env:ARCHITECTURE.zip"
          Compress-Archive -Path "$buildDirectory/*" -DestinationPath $zipPath -CompressionLevel Optimal

          dart run msix:create `
            --store `
            --architecture $env:ARCHITECTURE `
            --version $storeVersion `
            --build-windows false `
            --output-path $artifactDirectory `
            --output-name "Vernet-$env:RELEASE_TAG-windows-$env:ARCHITECTURE"

      - name: Upload Windows distributables
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-${{ matrix.architecture }}
          path: artifacts/${{ matrix.architecture }}/*
          if-no-files-found: error
          retention-days: 1

  publish-windows:
    name: Publish Windows packages to both channels
    runs-on: windows-2022
    needs:
      - create-release
      - release-windows
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Download Windows distributables
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: windows-*
          path: artifacts
          merge-multiple: true

      - name: Attach Windows packages to GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: artifacts/*.zip

      - name: Create multi-architecture MSIX bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packages = Get-ChildItem artifacts -Filter '*.msix' -Recurse
          $x64   = $packages | Where-Object Name -Match '-x64\.msix$'   | Select-Object -First 1
          $arm64 = $packages | Where-Object Name -Match '-arm64\.msix$' | Select-Object -First 1
          if (-not $x64 -or -not $arm64) { throw 'Both x64 and ARM64 MSIX packages are required.' }

          # Read the version from each package's identity manifest.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $versions = @{}
          foreach ($package in @($x64, $arm64)) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entry = $zip.GetEntry('AppxManifest.xml')
              $reader = [System.IO.StreamReader]::new($entry.Open())
              try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $versions[$package.Name] = $manifest.Package.Identity.Version
            } finally { $zip.Dispose() }
          }
          $version = $versions[$x64.Name]
          if ($version -ne $versions[$arm64.Name]) { throw 'MSIX package versions do not match.' }

          # The content directory must hold ONLY the .msix packages.
          # MakeAppx generates AppxBundleManifest.xml itself.
          $bundleDirectory = Join-Path $env:RUNNER_TEMP 'msix-bundle'
          if (Test-Path $bundleDirectory) { Remove-Item $bundleDirectory -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $bundleDirectory | Out-Null
          Copy-Item $x64.FullName   (Join-Path $bundleDirectory $x64.Name)
          Copy-Item $arm64.FullName (Join-Path $bundleDirectory $arm64.Name)

          $makeAppx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter MakeAppx.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found on the Windows runner.' }

          $bundlePath = Join-Path $env:RUNNER_TEMP "Vernet-$env:RELEASE_TAG.msixbundle"
          & $makeAppx.FullName bundle /d $bundleDirectory /p $bundlePath /bv $version /o
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx failed to create the MSIX bundle.' }

      # ms_store_release.yml uploads these exact bytes to the Store and a hand
      # dispatch re-reads them by run_id, so the published package is the one
      # this job signed.
      - name: Upload MSIX bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: msix-bundle
          path: ${{ runner.temp }}/Vernet-${{ env.RELEASE_TAG }}.msixbundle
          if-no-files-found: error
          retention-days: 1
          
      - name: Attach MSIX bundle to GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: ${{ runner.temp }}/Vernet-${{ env.RELEASE_TAG }}.msixbundle

  publish-ms-store:
    name: Publish MSIX bundle to Microsoft Store
    needs:
      - create-release
      - publish-windows
    uses: ./.github/workflows/ms_store_release.yml
    secrets: inherit

  # Last, and only because it has to be: `msstore publish` above rebuilds the
  # Store draft from the last published submission, so listing text staged
  # before it would be discarded. This leg captures the submission that now
  # names the bundle just shipped, overlays the words from metadata/store/, and
  # commits. Nothing depends on it, so a refused update -- the Store is busy
  # ingesting the package for a while after a commit -- leaves the release
  # intact and the listing for a mode=update dispatch.
  publish-ms-store-listing:
    name: Publish Microsoft Store listing
    needs:
      - create-release
      - publish-ms-store
    uses: ./.github/workflows/ms_store_metadata.yml
    with:
      mode: update
    secrets: inherit

name: Flutter release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build
        required: true
        type: string
    
permissions:
  contents: write

env:
  ANDROID_BUILD_PATH: ${{ vars.ANDROID_BUILD_PATH }}
  LINUX_BUILD_PATH: ${{ vars.LINUX_BUILD_PATH }}
  MACOS_BUILD_PATH: ${{ vars.MACOS_BUILD_PATH }}
  WINDOWS_BUILD_PATH: ${{ vars.WINDOWS_BUILD_PATH }}
  MACOS_DMG_PATH: installers/dmg_creator

jobs:
  release-approval:
    name: Approve release promotion
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      SQLITE_VERSION: 3.54.1
      SQLITE_BUILD_VERSION: 3540100
    steps:
      - name: Confirm release promotion
        run: echo "Approved release promotion for ${{ env.RELEASE_TAG }}"

  create-tag:
    name: Create or verify pubspec release tag
    runs-on: ubuntu-latest
    needs: release-approval
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create tag from pubspec version if needed
        run: |
          set -euo pipefail

          if [[ -n "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")" ]]; then
            exit 0
          fi

          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$/\1/p' pubspec.yaml)"
          if [[ "v${version}" != "$RELEASE_TAG" ]]; then
            echo "::error::Release tag must match pubspec.yaml (expected v${version})."
            exit 1
          fi

          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

  create-release:
    name: Create or reuse GitHub Release
    runs-on: ubuntu-latest
    needs: create-tag
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Create release with Fastlane changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          build_number="$(sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' pubspec.yaml)"
          changelog="android/fastlane/metadata/android/en-US/changelogs/${build_number}.txt"
          if [[ -z "$build_number" || ! -s "$changelog" ]]; then
            echo "::error::Could not find the Fastlane changelog for ${RELEASE_TAG}."
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Vernet ${RELEASE_TAG}" \
              --notes-file "$changelog"
          fi

  release-android-and-linux: 
    runs-on: ubuntu-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      LINUX_ZIP: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-linux.zip
      ANDROID_APK_ARM_V7A: app-armeabi-v7a-dev-release.apk
      ANDROID_APK_ARM_V8A: app-arm64-v8a-dev-release.apk
      ANDROID_APK_x86_64: app-x86_64-dev-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          java_version: '17'

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2.4
        with:
          fileName: key.jks
          encodedString: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" >> android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

      - name: Create artifacts directory
        run: mkdir -p artifacts
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build Android App and Linux Bundle
        # Use signing keys for release instead of debug
        run: |
          flutter build apk --split-per-abi --flavor dev
          flutter build linux --release

      - name: Rename ANDROID APKs
        run: |
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_ARM_V7A}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V7A}}
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_ARM_V8A}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V8A}}
          mv ${{ env.ANDROID_BUILD_PATH}}/${{env.ANDROID_APK_x86_64}} ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_x86_64}}

      - name: Linux Archive
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ${{ env.LINUX_ZIP }}
          directory: ${{  env.LINUX_BUILD_PATH }}

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V7A}}
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_ARM_V8A}}
            ${{ env.ANDROID_BUILD_PATH}}/Vernet-${{env.RELEASE_TAG}}-${{env.ANDROID_APK_x86_64}}

      - name: Publish Linux Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: ${{ env.LINUX_BUILD_PATH }}/${{ env.LINUX_ZIP }}

  release-firebase-hosting:
    name: Deploy Firebase Hosting with app release
    needs: create-release
    uses: ./.github/workflows/firebase_hosting.yml
    secrets: inherit
  
  release-macos: 
    runs-on: macos-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
      MACOS_ZIP: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-macos.zip
      MACOS_DMG: Vernet-${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}-macos.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Cache CocoaPods
        uses: actions/cache@v4.2.2
        with:
          path: macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap

      - name: Build macos release
        run: flutter build macos --release

      - name: Archive macos
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ${{ env.MACOS_ZIP }}
          directory: ${{ env.MACOS_BUILD_PATH }}

      - name: Setup Node 24
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          
      - name: Install Appdmg and Create dmg
        working-directory: ${{ env.MACOS_DMG_PATH }}
        run: |
          npm install -g appdmg
          appdmg ./config.json ./${{ env.MACOS_DMG }}

      - name: Publish macOS Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            ${{ env.MACOS_BUILD_PATH }}/${{ env.MACOS_ZIP }}
            ${{ env.MACOS_DMG_PATH }}/${{ env.MACOS_DMG }}

  release-windows:
    name: Build Windows ${{ matrix.architecture }} packages
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          # fix arm64 later when it flutter actions supports it.
          # - architecture: arm64
          #   runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install architecture-matched SQLite DLL and create distributables
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDirectory = "build/windows/$env:ARCHITECTURE/runner/Release"
          if (-not (Test-Path "$buildDirectory/vernet.exe")) {
            throw "Expected Windows build output was not found: $buildDirectory"
          }

          if ($env:ARCHITECTURE -eq 'x64') {
            # Chocolatey's sqlite package publishes x86/x64 DLLs and selects
            # x64 on the windows-2022 x64 runner.
            choco install sqlite -y --version $env:SQLITE_VERSION
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey failed to install SQLite.' }
            $sqliteDllPath = 'C:\ProgramData\chocolatey\lib\sqlite\tools\sqlite3.dll'
          } else {
            # Chocolatey's package does not include an ARM64 DLL. Use the
            # matching upstream SQLite archive on the Windows ARM64 runner.
            $sqliteArchive = Join-Path $env:RUNNER_TEMP 'sqlite-arm64.zip'
            $sqliteUrl = "https://www.sqlite.org/2026/sqlite-dll-win-arm64-$env:SQLITE_BUILD_VERSION.zip"
            Invoke-WebRequest -Uri $sqliteUrl -OutFile $sqliteArchive
            $sqliteExtract = Join-Path $env:RUNNER_TEMP 'sqlite-arm64'
            Expand-Archive -Path $sqliteArchive -DestinationPath $sqliteExtract -Force
            $sqliteDll = Get-ChildItem -Path $sqliteExtract -Filter sqlite3.dll -File -Recurse | Select-Object -First 1
            if (-not $sqliteDll) { throw "sqlite3.dll was not found in $sqliteUrl" }
            $sqliteDllPath = $sqliteDll.FullName
          }
          if (-not (Test-Path $sqliteDllPath)) { throw "SQLite DLL was not found at $sqliteDllPath" }
          Copy-Item $sqliteDllPath "$buildDirectory/sqlite3.dll" -Force

          $storeVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$').Matches.Groups[1].Value
          if (-not $storeVersion) { throw 'Could not derive the app version from pubspec.yaml.' }
          $storeVersion = "$storeVersion.0"

          $artifactDirectory = "artifacts/$env:ARCHITECTURE"
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          $zipPath = Join-Path $artifactDirectory "Vernet-$env:RELEASE_TAG-windows-$env:ARCHITECTURE.zip"
          Compress-Archive -Path "$buildDirectory/*" -DestinationPath $zipPath -CompressionLevel Optimal

          dart run msix:create `
            --store `
            --architecture $env:ARCHITECTURE `
            --version $storeVersion `
            --build-windows false `
            --output-path $artifactDirectory `
            --output-name "Vernet-$env:RELEASE_TAG-windows-$env:ARCHITECTURE"

      - name: Upload Windows distributables
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-${{ matrix.architecture }}
          path: artifacts/${{ matrix.architecture }}/*
          if-no-files-found: error
          retention-days: 1

  publish-windows:
    name: Publish Windows packages to both channels
    runs-on: windows-2022
    needs:
      - create-release
      - release-windows
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Download Windows distributables
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: windows-*
          path: artifacts
          merge-multiple: true

      - name: Attach Windows packages to GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: artifacts/*.zip

      - name: Create multi-architecture MSIX bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Get-ChildItem artifacts -Filter '*.msix' -Recurse
          $x64 = $packages | Where-Object Name -Match '-x64\.msix$' | Select-Object -First 1
          $arm64 = $packages | Where-Object Name -Match '-arm64\.msix$' | Select-Object -First 1
          if (-not $x64 -or -not $arm64) { throw 'Both x64 and ARM64 MSIX packages are required.' }

          # Derive the package version from the MSIX identity manifest.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $manifestEntries = @{}
          foreach ($package in @($x64, $arm64)) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entry = $zip.GetEntry('AppxManifest.xml')
              $reader = [System.IO.StreamReader]::new($entry.Open())
              try { [xml]$appManifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $manifestEntries[$package.Name] = $appManifest.Package.Identity.Version
            } finally { $zip.Dispose() }
          }
          $version = $manifestEntries[$x64.Name]
          if ($version -ne $manifestEntries[$arm64.Name]) { throw 'MSIX package versions do not match.' }

          $bundleDirectory = Join-Path $env:RUNNER_TEMP 'msix-bundle'
          New-Item -ItemType Directory -Force -Path "$bundleDirectory/Packages" | Out-Null
          Copy-Item $x64.FullName "$bundleDirectory/Packages/$($x64.Name)"
          Copy-Item $arm64.FullName "$bundleDirectory/Packages/$($arm64.Name)"
          $bundleXml = @"
          <Bundle xmlns="http://schemas.microsoft.com/appx/2013/bundle">
            <Identity Name="OpenSociety.VernetApp" Publisher="CN=89BA02CB-9308-4756-8038-C5914BBAE367" Version="$version" />
            <Packages>
              <Package Type="application" Version="$version" Architecture="x64" ResourceId="" FileName="Packages/$($x64.Name)" />
              <Package Type="application" Version="$version" Architecture="arm64" ResourceId="" FileName="Packages/$($arm64.Name)" />
            </Packages>
          </Bundle>
          "@
          Set-Content -Path "$bundleDirectory/AppxBundleManifest.xml" -Value $bundleXml -Encoding UTF8
          $makeAppx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter MakeAppx.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found on the Windows runner.' }
          & $makeAppx.FullName bundle /d $bundleDirectory /p "$env:RUNNER_TEMP/Vernet-$env:RELEASE_TAG.msixbundle" /o
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx failed to create the MSIX bundle.' }

      - name: Attach MSIX bundle to GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: ${{ runner.temp }}/Vernet-${{ env.RELEASE_TAG }}.msixbundle

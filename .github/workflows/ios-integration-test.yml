name: iOS Integration Tests

on:
  workflow_dispatch:
    inputs:
      legs:
        description: Simulator legs to run
        type: choice
        options:
          - ios-18
          - latest
          - both
        default: ios-18
  workflow_call:
  schedule:
    # Weekly check for breakage on the newest simulator runtime. Xcode 26's
    # runtime is currently unreliable on hosted runners, so it must not gate
    # pull requests.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ios-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-legs:
    name: Select simulator legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          LEGS: ${{ inputs.legs }}
        run: |
          case "$EVENT:$LEGS" in
            schedule:*)
              echo 'value={"include":[{"label":"latest","ios_version":"latest"}]}' >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch:latest)
              echo 'value={"include":[{"label":"latest","ios_version":"latest"}]}' >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch:both)
              echo 'value={"include":[{"label":"iOS 18.0","ios_version":"18.0"},{"label":"latest","ios_version":"latest"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'value={"include":[{"label":"iOS 18.0","ios_version":"18.0"}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  ios-integration-test:
    name: iOS integration tests (${{ matrix.label }})
    needs: select-legs
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-legs.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start simulator setup
        shell: bash
        env:
          IOS_VERSION: ${{ matrix.ios_version }}
        run: |
          nohup bash scripts/ci/prepare_ios_simulator.sh "$IOS_VERSION" \
            > /tmp/sim-setup.log 2>&1 < /dev/null &
          echo $! > /tmp/sim-setup.pid
          echo "Simulator bring-up started as pid $(cat /tmp/sim-setup.pid)."

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap

      # No unit stage here on purpose: this leg exists to reach a simulator, and
      # flutter test --coverage already runs those same tests on macos, ubuntu
      # and windows in the same pipeline. Re-running them cost 5 minutes of
      # macOS runner time for no extra signal.

      - name: Use CocoaPods instead of Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Wait for simulator
        shell: bash
        run: |
          set -uo pipefail

          pid="$(cat /tmp/sim-setup.pid)"
          deadline=$((SECONDS + 1800))
          while kill -0 "$pid" 2>/dev/null; do
            if (( SECONDS > deadline )); then
              echo "::error::Simulator setup did not finish within 30 minutes."
              tail -n 60 /tmp/sim-setup.log
              kill "$pid" 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

          if [[ ! -s /tmp/sim-udid ]]; then
            echo "::error::Simulator setup failed (pid $pid)."
            cat /tmp/sim-setup.log
            exit 1
          fi

          udid="$(cat /tmp/sim-udid)"
          echo "Using booted simulator $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Grant location permission
        shell: bash
        run: |
          xcrun simctl privacy "$SIMULATOR_UDID" \
            grant location org.osociety.vernet.store || true

      - name: Run integration tests
        run: flutter test --no-pub integration_test/app_test.dart -d "$SIMULATOR_UDID"

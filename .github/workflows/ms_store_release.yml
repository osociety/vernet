name: Microsoft Store release

# Publishes the multi-architecture MSIX bundle and the Store listing to the
# live product as one submission. flutter_release.yml's publish-windows job
# builds and signs the bundle; this workflow never builds — it hands those
# exact bytes to the Store and overlays the words versioned under msstore/
# onto the same submission, the same shape as play_store_release.yml including
# the run_id input that re-publishes an older release's bundle.
#
# One submission, not two writes: `msstore publish --noCommit` creates a draft,
# PUTs the configured submission and uploads the package blob, then returns
# without committing (IStorePackagedAPIExtensions.cs, `if (noCommit)`). The
# capture below reads that draft back — `submission get` takes
# PendingApplicationSubmission first and only falls back to the last published
# one — `submission update` replaces that same draft's JSON with the overlaid
# payload, and `submission publish` commits. Certification starts once.
#
# Listing text used to go in a second, later submission through
# ms_store_metadata.yml. That shape could not work: `submission update` PUTs
# onto `application.PendingApplicationSubmission.Id`, and after the release
# committed the package that submission is already in certification, so a
# listing write could be accepted by the API and still not be the draft Partner
# Center shows. The retry window that chased the refusals was a symptom of the
# ordering, not of a busy Store.
#
# Two consequences worth knowing:
#   - The CLI cannot make a first publication, it can only update a product
#     that is already live. 9N1170N3PHMM is.
#   - `publish` deletes a draft that already exists before creating its own, so
#     a submission staged by hand in Partner Center does not survive a release.
#     The listing lives in git and is re-applied every release for that reason.
#
# `submission poll` is deliberately not run: it blocks until the submission
# reaches a terminal state, and Store certification outlives this job's timeout,
# which would turn a submitted release red while it was still being reviewed.
# The last step prints the state instead.
#
# One submission means one failure surface: a listing tree the Store refuses now
# stops the package with it, where the separate metadata lane could fail and leave
# a released app behind. The `--check` step is what pays for that — it reads the
# same limits the assembler enforces, before any credential is used.
#
# A failure after the upload leaves an uncommitted draft with the new package
# in it and nothing on the storefront. That is the safe half: the next release's
# publish deletes it, and the log names the step that stopped.

on:
  workflow_call:
    inputs:
      run_id:
        description: Run that built the MSIX bundle
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID that built the MSIX bundle (blank for this run)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  # Only needed when run_id points at an earlier release run.
  actions: read

concurrency:
  group: ms-store-publish
  cancel-in-progress: false

env:
  # Not a secret: the product ID is the public Store listing URL segment and
  # README.md already links it.
  MSSTORE_PRODUCT_ID: 9N1170N3PHMM
  # Pinned so a CLI release cannot change what a publish does unreviewed.
  # v0.4.2 added --payload for large submission JSON and stopped
  # --uploadTimeout defaulting to 0, which failed every blob upload; v0.4.3
  # keeps a free product's price when publishing; v0.4.4 added --noCommit, which
  # is what makes the package and the listing one submission.
  MSSTORE_CLI_VERSION: v0.4.4

jobs:
  publish:
    name: Publish MSIX bundle to Microsoft Store
    timeout-minutes: 45
    if: github.event.repository.fork != true
    runs-on: windows-2022
    steps:
      # The assembler and msstore/ are read from the tag this release cut from,
      # so the listing that ships is the one that was reviewed.
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # The Store publishes one file for both architectures, so the bundle
      # artifact is the only thing this job needs from the release run.
      - name: Download MSIX bundle
        uses: actions/download-artifact@v4.3.0
        with:
          name: msix-bundle
          path: release
          run-id: ${{ inputs.run_id || github.run_id }}
          repository: ${{ github.repository }}

      - name: Confirm the bundle carries both architectures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem release -Filter '*.msixbundle' -File | Select-Object -First 1
          if (-not $bundle) { throw 'The msix-bundle artifact contained no .msixbundle.' }

          # A single-architecture bundle publishes cleanly and then ships to
          # only part of the install base, so both packages have to be inside.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
            # GetEntry matches the whole path, and an AppxBundle keeps its
            # manifest under AppxMetadata/, so a root lookup is always null.
            $entry = $zip.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if (-not $entry) {
              throw "$($bundle.Name) has no AppxMetadata/AppxBundleManifest.xml. Entries: $((($zip.Entries | ForEach-Object FullName) -join ', '))"
            }
            $packages = @($zip.Entries | Where-Object { $_.Name -like '*.msix' } | ForEach-Object FullName)
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }

          foreach ($architecture in @('x64', 'arm64')) {
            if (-not ($packages | Where-Object { $_ -match $architecture })) {
              throw "Bundle carries no $architecture package: $($packages -join ', ')"
            }
          }

          Write-Host "Publishing $($bundle.Name) ($($packages -join ', '))."
          # The manifest root is Bundle in a default namespace, so match the
          # local name; GetElementsByTagName ignores the namespace URI.
          $identity = $manifest.GetElementsByTagName('Identity')[0]
          if ($identity) { Write-Host "Bundle version $($identity.Version), package family $($identity.Name)." }

          # The next steps run in a separate shell, so hand the path over as
          # an environment variable instead of re-discovering it.
          "MSSTORE_BUNDLE=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The assembler imports dart:io and dart:convert only, so this needs the
      # Dart SDK, not the Flutter toolchain, pub get or code generation.
      - name: Install Dart
        uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: stable

      # Before any credential is used and before the Store is touched: an
      # over-long description, a comma-joined list, or a keyword tree that spends
      # more than the 21 words the submission shares fails in seconds, and the
      # release keeps its draft for the next run instead of putting a
      # half-written listing in front of shoppers. The last is what the 2026-11-22
      # releases paid for, twice: the Store reports it only after the package sits
      # in a draft, it names no locale, and it counts hyphen-separated words, not
      # the keywords a whitespace split reports.
      - name: Check the listing tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dart run scripts/ms_store_listing.dart --check
          if ($LASTEXITCODE -ne 0) { throw 'msstore/ is not publishable as it stands.' }

      - name: Configure the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: ${{ env.MSSTORE_CLI_VERSION }}

      # Credentials go through the step environment rather than being
      # interpolated into the script text, so no secret lands in the rendered
      # command line. $ErrorActionPreference cannot see a native exit code, so
      # every msstore call is checked the way the Windows build steps do.
      - name: Reconfigure store credentials
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # msstore binds --sellerId as a string and runs it through
          # Convert.ToInt32, so a value that is not the plain MPN number dies
          # inside .NET with a FormatException whose only clue is a masked
          # secret. The shape is the whole diagnosis: the Account ID GUID, a
          # thousands separator and a pasted non-breaking space differ here.
          [int]$sellerId = 0
          if (-not [int]::TryParse("$env:SELLER_ID", [ref] $sellerId)) {
            $value = "$env:SELLER_ID"
            if ($value.Length -eq 0) { throw 'SELLER_ID is empty: the secret is not set for this run.' }
            $classes = @()
            if ($value -match '[A-Za-z]') { $classes += 'letters' }
            if ($value -match '-') { $classes += 'dashes' }
            if ($value -match '[0-9],[0-9]') { $classes += 'thousands separators' }
            if ($value -match '\s') { $classes += 'whitespace' }
            if ($value -match '[^\x20-\x7E]') { $classes += 'non-ASCII bytes' }
            $digits = ($value -replace '\D', '').Length
            $found = if ($classes.Count -gt 0) { $classes -join ', ' } else { 'a number past the 32-bit id msstore expects' }
            throw "SELLER_ID must be the numeric Seller Id from Partner Center (Account settings > Organization profile > Legal info). It has $($value.Length) characters, $digits of them digits; found $found."
          }
          msstore reconfigure --tenantId "$env:AZURE_AD_TENANT_ID" --sellerId "$env:SELLER_ID" `
            --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure exited with $LASTEXITCODE." }

      - name: Upload the package into a draft submission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msstore publish "$env:MSSTORE_BUNDLE" --appId "$env:MSSTORE_PRODUCT_ID" --noCommit
          if ($LASTEXITCODE -ne 0) {
            throw "msstore publish --noCommit exited with $LASTEXITCODE - the package is not in a draft submission."
          }

      # The draft just created, which is why this step runs after the upload:
      # the capture is the base the overlay writes onto, so screenshots,
      # markets, hardware and the package list come from the Store and only the
      # words come from git.
      #
      # The capture is written raw and only into the runner's temp directory. It
      # carries shared-access URLs for the package blobs, which are write access
      # to Microsoft storage for this product, and these logs are public.
      - name: Capture the draft submission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $live = Join-Path $env:RUNNER_TEMP 'live-submission.json'
          msstore submission get "$env:MSSTORE_PRODUCT_ID" |
            Set-Content -Path $live -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get exited with $LASTEXITCODE." }

          $submission = Get-Content -Raw $live | ConvertFrom-Json
          if (-not $submission) { throw 'The captured draft was not valid JSON.' }
          $locales = @($submission.Listings.PSObject.Properties.Name)
          if ($locales.Count -lt 1) { throw 'The captured draft carries no listings.' }

          # The payload PUTs this package list back, so a draft from before the
          # upload would put an older build on the storefront with every step
          # above still green. Naming the file the bundle step just found is the
          # cheapest way to prove the capture is the one this run made.
          $packages = @($submission.ApplicationPackages.FileName)
          $bundle = Split-Path -Leaf "$env:MSSTORE_BUNDLE"
          if ($packages -notcontains $bundle) {
            throw "The captured draft does not hold $bundle. It names: $($packages -join ', ')"
          }

          Write-Host "Draft $bundle serves $($locales.Count) locales: $($locales -join ', ')."

      # The Store replaces the whole submission on every write, so the payload
      # is assembled rather than stored, and the commit is the last thing this
      # job does. One attempt: a refusal here is a payload problem the `--check`
      # step above should have caught, and an uncommitted draft is harmless —
      # the next release deletes it. --verbose because it is the only channel
      # that carries the Store's reason; the CLI otherwise prints `Error!`.
      - name: Overlay the listing and submit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $live = Join-Path $env:RUNNER_TEMP 'live-submission.json'
          $payload = Join-Path $env:RUNNER_TEMP 'payload.json'

          dart run scripts/ms_store_listing.dart --submission $live --out $payload
          if ($LASTEXITCODE -ne 0) { throw "The listing assembler exited with $LASTEXITCODE - nothing was submitted." }

          # --payload rather than the JSON inline: a 29-locale listing passes the
          # 32,767 character command-line limit that Microsoft's own snippet hits.
          #
          # `submission update` answers with the whole updated submission JSON on
          # stdout, which holds the signed upload urls, so nothing this step runs
          # is echoed verbatim into a public log. Redact first, print the shape of
          # the reply only, and print nothing at all if a signature survived.
          $mask = {
            param($text)
            [regex]::Replace($text, '(https?://[^"]*\.blob\.core\.windows\.net/[^"]*)\?[^"]*', '$1?<query redacted>')
          }
          $cli = @('submission', 'update', "$env:MSSTORE_PRODUCT_ID", '--payload', $payload, '--verbose')
          $raw = & msstore $cli 2>&1 | Out-String
          $exit = $LASTEXITCODE
          $reply = & $mask "$raw"
          if ($reply -match 'sig=' -or $reply -match 'skoid=') {
            Write-Host 'The Store reply held a signed url after redaction, so it is not printed.'
            $reply = ''
          }
          if ($exit -ne 0) {
            throw "msstore submission update was refused (exit $exit): $(($reply.Trim() -replace '\r?\n', ' | '))"
          }
          Write-Host 'The Store accepted the package and the listing as one submission.'

          # Certification starts here and takes longer than this job, which is
          # why nothing polls it.
          $ErrorActionPreference = 'Stop'
          msstore submission publish "$env:MSSTORE_PRODUCT_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "msstore submission publish exited with $LASTEXITCODE - the draft holds the package and the listing but was not submitted."
          }

      # Read-only, and the log is where the certification state is visible
      # without opening Partner Center. A failure here says nothing about the
      # steps above, so it must not turn a green release red.
      - name: Report the submission state
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: msstore submission status "$env:MSSTORE_PRODUCT_ID"

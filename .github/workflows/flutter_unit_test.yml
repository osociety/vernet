name: Flutter Unit Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: flutter-unit-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  flutter-unit-test:
    name: Unit Tests on ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          java_version: ${{ matrix.os != 'macos' && '17' || '' }}

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --fatal-warnings

      # The only place a store-listing text change is reviewed before it merges:
      # the release lanes check their own limits, and this checks the sentence a
      # limit cannot see. Pure Dart and no credentials, so it needs no new leg.
      - name: Check published copy for unqualified claims
        run: dart run scripts/check_store_claims.dart --check

      - name: Run unit tests
        run: flutter test
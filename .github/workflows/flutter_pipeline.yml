name: Flutter main pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: flutter-main-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests and analysis
    uses: ./.github/workflows/flutter_unit_test.yml
    secrets: inherit

  integration-tests:
    name: Integration tests and coverage
    if: github.event_name == 'push'
    needs: unit-tests
    uses: ./.github/workflows/flutter_test_main.yml
    secrets: inherit

  android-integration-tests:
    name: Android integration tests
    if: github.event_name == 'push'
    needs: integration-tests
    uses: ./.github/workflows/android-integration-test.yml
    secrets: inherit

  detect-deployments:
    name: Detect release and Hosting changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: android-integration-tests
    outputs:
      release: ${{ steps.detect.outputs.release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      firebase_changed: ${{ steps.detect.outputs.firebase_changed }}
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect release metadata and Firebase content changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          release=false
          tag_name=""
          if grep -Fxq 'pubspec.yaml' <<< "$changed_files"; then
            version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$/\1/p' pubspec.yaml)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
              echo "::error::pubspec.yaml must contain a release version like 1.2.3+45."
              exit 1
            fi

            build_number="${version##*+}"
            changelog="fastlane/metadata/android/en-US/changelogs/${build_number}.txt"
            if ! grep -Fxq "$changelog" <<< "$changed_files" || [[ ! -s "$changelog" ]]; then
              echo "::error::A release PR must update ${changelog} together with pubspec.yaml."
              exit 1
            fi

            tag_name="v${version}"
            existing_tag="$(git ls-remote --tags origin "refs/tags/${tag_name}")"
            if [[ -n "$existing_tag" ]]; then
              echo "::error::Release tag ${tag_name} already exists on origin."
              exit 1
            fi

            git tag "$tag_name" "$HEAD_SHA"
            git push origin "$tag_name"
            release=true
          fi

          firebase_changed=false
          while IFS= read -r path; do
            case "$path" in
              firebase/public/*|firebase/firebase.json|firebase/.firebaserc|.github/workflows/firebase_hosting.yml)
                firebase_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          {
            echo "release=${release}"
            echo "tag_name=${tag_name}"
            echo "firebase_changed=${firebase_changed}"
          } >> "$GITHUB_OUTPUT"

  deploy-firebase-content:
    name: Deploy Firebase Hosting content changes
    if: github.event_name == 'push' && needs.detect-deployments.outputs.firebase_changed == 'true' && needs.detect-deployments.outputs.release != 'true'
    needs: detect-deployments
    uses: ./.github/workflows/firebase_hosting.yml
    secrets: inherit

  publish-release:
    name: Approve and build release
    if: github.event_name == 'push' && needs.detect-deployments.outputs.release == 'true'
    needs: detect-deployments
    uses: ./.github/workflows/flutter_release.yml
    with:
      tag_name: ${{ needs.detect-deployments.outputs.tag_name }}
    secrets: inherit
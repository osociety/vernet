name: Flutter main pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: flutter-main-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests and analysis
    uses: ./.github/workflows/flutter_unit_test.yml
    secrets: inherit

  integration-tests:
    name: Integration tests and coverage
    if: github.event_name == 'push'
    needs: unit-tests
    uses: ./.github/workflows/flutter_test_main.yml
    secrets: inherit

  android-integration-tests:
    name: Android integration tests
    if: github.event_name == 'push'
    needs: integration-tests
    uses: ./.github/workflows/android-integration-test.yml
    secrets: inherit

  prepare-release:
    name: Version and prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - android-integration-tests
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Increment version and generate Fastlane changelog
        id: version
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          version_path = 'pubspec.yaml'
          contents = File.read(version_path)
          match = contents.match(/^version:\s+(\d+)\.(\d+)\.(\d+)\+(\d+)\s*$/)
          abort 'Could not parse pubspec.yaml version (expected major.minor.patch+build).' unless match

          major, minor, patch, current_build = match.captures.map(&:to_i)
          changelog_ids = Dir.glob('fastlane/metadata/android/en-US/changelogs/*.txt').filter_map do |path|
            filename = File.basename(path, '.txt')
            filename.to_i if filename.match?(/^\d+$/)
          end
          build = [current_build, changelog_ids.max || 0].max + 1
          patch += 1
          contents.sub!(/^version:\s+.*$/, "version: #{major}.#{minor}.#{patch}+#{build}")
          version = contents.match(/^version:\s+(\d+\.\d+\.\d+)\+(\d+)\s*$/)[1]
          File.write(version_path, contents)

          File.write(ENV.fetch('GITHUB_OUTPUT'), "version=#{version}\ntag_name=v#{version}\nbuild_number=#{build}\n", mode: 'a')
          RUBY

      - name: Generate changelog, commit version and tag
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changelog="fastlane/metadata/android/en-US/changelogs/${BUILD_NUMBER}.txt"
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TESTED_SHA" 2>/dev/null || true)"

          if [[ -n "$previous_tag" ]]; then
            git log "${previous_tag}..HEAD" --no-merges --pretty=format:'- %s' > "$changelog"
          else
            git log -20 --no-merges --pretty=format:'- %s' > "$changelog"
          fi

          if [[ ! -s "$changelog" ]]; then
            printf '%s\n' "- ${COMMIT_MESSAGE%%$'\n'*}" > "$changelog"
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pubspec.yaml "$changelog"
          git commit -m "chore(release): ${TAG_NAME}"
          git tag "$TAG_NAME"

          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]]; then
            echo "::error::main advanced while checks were running; refusing to release an unvalidated commit."
            exit 1
          fi

          git push origin HEAD:main "$TAG_NAME"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          gh release create "$TAG_NAME" \
            --draft \
            --title "Vernet ${TAG_NAME}" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/${BUILD_NUMBER}.txt"

  publish-release:
    name: Approve and build release
    if: github.event_name == 'push'
    needs: prepare-release
    uses: ./.github/workflows/flutter_release.yml
    with:
      tag_name: ${{ needs.prepare-release.outputs.tag_name }}
    secrets: inherit
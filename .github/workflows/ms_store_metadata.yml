name: Microsoft Store metadata

# Publishes the Store listing (title, description, features, keywords, release
# notes) from the text versioned under msstore/<locale>/.
#
# The tree sits at the repository root, not under metadata/, because F-Droid
# builds this same checkout: fdroidserver scans build/<package>/metadata/<locale>
# and copies any text it finds over what it read from fastlane, so a metadata/
# directory here would silently become the Android listing's English prose.
#
# The Store replaces the whole submission on every update, so the payload is
# assembled rather than stored: capture the live submission, overlay this
# repository's words, and send the result. Screenshots, packages, markets and
# hardware stay the Store's business because nothing in git owns them; the
# listing prose lives in git because that is where a rewrite gets reviewed.
#
# A committed metadata.json used to be that capture. It went stale on
# every release -- the file names the MSIX it was taken from, so publishing it
# after a newer build shipped would have put the older package back on the
# storefront -- and re-capturing it by hand was the chore that proved the model
# wrong. Assembling from a fresh capture makes that staleness impossible, which
# is why the step that compared committed packages with live ones is gone.
#
# Three modes, split so a listing change never reaches shoppers on its own:
#
#   get     read the live submission and upload a redacted copy
#   stage   overlay git onto the capture and write the draft, submit nothing
#   update  stage, then commit that draft so certification starts
#
# A push to the listing text on main stages: the words land in Partner Center
# as a draft where they can be read, and nothing ships until the release
# pipeline or a deliberate mode=update dispatch submits them. Staged is not
# durable -- the next package publish rebuilds the draft -- so a listing change
# waits for a release instead of going live on its own. A field git does not
# declare is carried through untouched, so a manual Partner Center edit of one
# survives the overlay.
#
# What `Error!` is: the CLI throwing the Store's answer away. SubmissionClient
# only wraps a reply in its structured error type when the body deserialises as
# a ResponseWrapper with errors, and the PUT for a packaged submission asks for a
# DevCenterSubmission, so any other failure lands in the generic branch of
# StatusContextExtensions.ErrorStatus, which prints the literal `Error!` and no
# text at all. The reason is therefore always in the response body and only ever
# on the console with --verbose, which is what the retry loop runs on the first
# and last attempt. Do not read a refusal as "a draft was open": on 2026-11-18
# every attempt met PendingCommit holding Vernet-v1.7.0+84, which proves a draft
# existed and proves nothing about what updateMetadata objected to.
#
# For an MSIX product the CLI makes package and listing one write, not two: the
# docs call `submission update` and `submission updateMetadata` equivalent
# because both PUT the whole submission JSON, and the documented order is
# `publish <package> --noCommit`, then get, edit, update, then `submission
# publish` and `poll`. flutter_release.yml takes the other shape -- it lets
# ms_store_release.yml commit the package, then calls this workflow with
# mode=update -- which is only safe because publish deletes any pending draft and
# rebuilds from the last published submission, so the text this workflow stages
# has to come after it and never before.
#
# A locale directory has to name a language the product already serves (en-us,
# de-de, fr-fr). Enable a new one in Partner Center first -- Store listing >
# Add/remove languages -- then run with allow_new_locales. Text written for a
# language that is not enabled yet lives under msstore/pending/, which
# the assembler does not read, so the tree can carry more languages than the
# product serves without refusing the publish.
#
# Titles are the one field git does not fully own: the Store only accepts a
# product name it has reserved for this submission, so a title.txt that is not
# one of them is skipped, with a log line, and the served name kept.
# msstore/reserved_titles.txt says which names are reserved.

on:
  push:
    branches: [main]
    paths:
      - msstore/**
  workflow_call:
    inputs:
      mode:
        description: stage writes a draft, update stages and submits it
        type: string
        required: false
        default: update
      allow_new_locales:
        description: every locale in git is already enabled on the product
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      mode:
        description: get captures, stage writes a draft, update stages and submits it
        type: choice
        options:
          - get
          - stage
          - update
        default: get
        required: true
      allow_new_locales:
        description: every locale in git is already enabled on the product
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  # Same group as ms_store_release.yml: a package publish discards whatever
  # listing draft exists, so the two must never overlap.
  group: ms-store-publish
  cancel-in-progress: false

env:
  # Same product and same pinned CLI as ms_store_release.yml.
  MSSTORE_PRODUCT_ID: 9N1170N3PHMM
  MSSTORE_CLI_VERSION: v0.4.4

jobs:
  metadata:
    name: ${{ inputs.mode == 'get' && 'Fetch' || inputs.mode == 'update' && 'Publish' || 'Stage' }} Store listing metadata
    timeout-minutes: 35
    if: github.event.repository.fork != true
    runs-on: windows-2022
    env:
      # Keyed on the input, never on github.event_name: inside a nested `uses:`
      # chain that context still reports the root event, and a push carries no
      # inputs at all. Keying on the event therefore made the release stage
      # instead of publish - run 43594484224 named the job `Publish Store
      # listing metadata` from inputs.mode while MODE itself resolved to `stage`.
      MODE: ${{ inputs.mode || 'stage' }}
      ALLOW_NEW_LOCALES: ${{ inputs.allow_new_locales }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # The assembler imports dart:io and dart:convert only, so this needs the
      # Dart SDK, not the Flutter toolchain, pub get or code generation.
      - name: Install Dart
        if: env.MODE != 'get'
        uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: stable

      # Before any credential is used and before the Store is touched: an
      # over-long description fails in seconds rather than after a capture.
      - name: Check the listing tree
        if: env.MODE != 'get'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dart run scripts/ms_store_listing.dart --check
          if ($LASTEXITCODE -ne 0) { throw 'msstore/ is not publishable as it stands.' }

      - name: Configure the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: ${{ env.MSSTORE_CLI_VERSION }}

      # Credentials go through the step environment rather than the script
      # text, so no secret lands in a rendered command line.
      - name: Reconfigure store credentials
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # msstore binds --sellerId as a string and runs it through
          # Convert.ToInt32, so a value that is not the plain MPN number dies
          # inside .NET with a FormatException whose only clue is a masked
          # secret. The shape is the whole diagnosis: the Account ID GUID, a
          # thousands separator and a pasted non-breaking space differ here.
          [int]$sellerId = 0
          if (-not [int]::TryParse("$env:SELLER_ID", [ref] $sellerId)) {
            $value = "$env:SELLER_ID"
            if ($value.Length -eq 0) { throw 'SELLER_ID is empty: the secret is not set for this run.' }
            $classes = @()
            if ($value -match '[A-Za-z]') { $classes += 'letters' }
            if ($value -match '-') { $classes += 'dashes' }
            if ($value -match '[0-9],[0-9]') { $classes += 'thousands separators' }
            if ($value -match '\s') { $classes += 'whitespace' }
            if ($value -match '[^\x20-\x7E]') { $classes += 'non-ASCII bytes' }
            $digits = ($value -replace '\D', '').Length
            $found = if ($classes.Count -gt 0) { $classes -join ', ' } else { 'a number past the 32-bit id msstore expects' }
            throw "SELLER_ID must be the numeric Seller Id from Partner Center (Account settings > Organization profile > Legal info). It has $($value.Length) characters, $digits of them digits; found $found."
          }
          msstore reconfigure --tenantId "$env:AZURE_AD_TENANT_ID" --sellerId "$env:SELLER_ID" `
            --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure exited with $LASTEXITCODE." }

      # The payload goes to stdout and the progress text to stderr, so the
      # redirect captures clean JSON.
      #
      # The capture is written raw, and only into the runner's temp directory:
      # it carries shared-access URLs for the package blobs, which are
      # credentials against a public repository. mode=get additionally writes a
      # redacted copy into the workspace, because reading a capture is the
      # cheapest way to see what the Store actually serves to shoppers.
      - name: Capture the live submission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $live = Join-Path $env:RUNNER_TEMP 'live-submission.json'
          msstore submission get "$env:MSSTORE_PRODUCT_ID" |
            Set-Content -Path $live -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get exited with $LASTEXITCODE." }

          $submission = Get-Content -Raw $live | ConvertFrom-Json
          if (-not $submission) { throw 'The captured submission was not valid JSON.' }
          $locales = @($submission.Listings.PSObject.Properties.Name)
          if ($locales.Count -lt 1) { throw 'The captured submission carries no listings.' }
          Write-Host "Captured $($locales -join ', ') serving $(@($submission.ApplicationPackages.FileName) -join ', ')."
          # Printed every run, because the job name is built from inputs.mode
          # while the steps act on MODE, and a release proved they can disagree.
          Write-Host "Mode = $env:MODE."

          if ($env:MODE -eq 'get') {
            $raw = Get-Content -Raw $live
            $redacted = [regex]::Replace($raw, '(https://[^"]*\.blob\.core\.windows\.net/[^"]*)\?[^"]*', '$1')
            if ($redacted -match 'sig=' -or $redacted -match 'skoid=') {
              throw 'A signed blob URL survived redaction; refusing to upload it.'
            }
            New-Item -ItemType Directory -Force -Path capture | Out-Null
            Set-Content -Path capture/metadata.json -Value $redacted -Encoding utf8NoBOM -NoNewline
            Write-Host "Uploaded a redacted copy ($($redacted.Length) characters)."
          }

      # A release run gets here seconds after msstore publish committed the
      # package, and the Store refuses a metadata write while it still holds
      # that submission: v1.6.4+83 lost this leg to five refusals inside four
      # minutes, with the package submission still certifying when the job
      # ended. So the window is about twenty minutes, and every refusal also
      # reports the state the Store is actually in, because the CLI itself says
      # only "Error!". If the window is spent the log names the one dispatch
      # that finishes the job once certification clears.
      #
      # $ErrorActionPreference is deliberately Continue here: the CLI writes its
      # complaint to stderr, and a retry loop has to read that text instead of
      # having PowerShell throw on the first line of it. The exit code still
      # decides, and the loop throws once the window is spent.
      - name: Stage the listing
        if: env.MODE != 'get'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $live = Join-Path $env:RUNNER_TEMP 'live-submission.json'
          $payload = Join-Path $env:RUNNER_TEMP 'payload.json'

          $assemble = @('run', 'scripts/ms_store_listing.dart', '--submission', $live, '--out', $payload)
          if ($env:ALLOW_NEW_LOCALES -eq 'true') { $assemble += '--allow-new-locales' }
          & dart $assemble
          if ($LASTEXITCODE -ne 0) { throw "The listing assembler exited with $LASTEXITCODE." }

          # --payload rather than the JSON inline: a multi-locale listing passes
          # the 32,767 character command-line limit that Microsoft's own
          # snippet hits.
          #
          # Nothing that comes back from the Store is echoed verbatim. A
          # submission JSON carries FileUploadUrl -- a signed ingestion blob url
          # is write access to Microsoft storage for this product -- and these
          # logs are public: run 43869000876 printed one on 2026-11-16 because
          # the success branch echoed the command's output. Redact first, print
          # the shape of the reply only.
          $mask = {
            param($text)
            [regex]::Replace($text, '(https?://[^"]*\.blob\.core\.windows\.net/[^"]*)\?[^"]*', '$1?<query redacted>')
          }
          $attempts = 14
          $gap = 90
          $states = @()
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            # --verbose on the first and last attempt only: it is the single
            # channel that carries the Store's reason, which the CLI otherwise
            # discards, and two readable refusals beat fourteen identical ones.
            $cli = @('submission', 'updateMetadata', "$env:MSSTORE_PRODUCT_ID", '--payload', $payload)
            if ($attempt -eq 1 -or $attempt -eq $attempts) { $cli += '--verbose' }
            $raw = & msstore $cli 2>&1 | Out-String
            $output = & $mask "$raw"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "The Store accepted the listing on attempt $attempt. Its reply is not printed: a submission JSON holds signed upload urls."
              exit 0
            }
            Write-Host "Attempt $attempt of $attempts was refused (exit $LASTEXITCODE):"
            if ($output.Trim()) { Write-Host ($output.Trim() -replace '\r?\n', ' | ') }
            $raw = msstore submission status "$env:MSSTORE_PRODUCT_ID" 2>&1 | Out-String
            $state = & $mask "$raw"
            Write-Host "  the Store says: $($state.Trim() -replace '\r?\n', ' ')"
            $states += $state
            if ($attempt -lt $attempts) { Start-Sleep -Seconds $gap }
          }
          $seen = @($states | ForEach-Object { $_.Trim() -replace '\r?\n', ' ' } | Select-Object -Unique)
          Write-Host "States seen across the refusals: $($seen -join ' | ')"
          if (($seen -join ' ') -match 'PendingCommit') {
            Write-Host 'At least one refusal met a PendingCommit submission, so a draft was open for part of the window. That is an observation about the product, not the cause of the refusal: the verbose attempts above hold what the Store objected to.'
          }
          throw "msstore submission updateMetadata refused the payload $attempts times. Attempts 1 and $attempts ran --verbose, so the Store's own reason is in this log. Fix that, then: gh workflow run ms_store_metadata.yml -f mode=update -R $env:GITHUB_REPOSITORY"

      - name: Publish the listing
        if: env.MODE == 'update'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msstore submission publish "$env:MSSTORE_PRODUCT_ID"
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish exited with $LASTEXITCODE." }

      # Read-only, and a failure here says nothing about the steps above, so it
      # must not turn a green publish red.
      - name: Report the submission state
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          msstore submission status "$env:MSSTORE_PRODUCT_ID"

          # Says so out loud, because on a push every step above looks like a
          # publish and only this one draws the distinction in the log.
          if ($env:MODE -ne 'update') {
            Write-Host 'Nothing was submitted. To take the staged draft live:'
            Write-Host "  gh workflow run ms_store_metadata.yml -f mode=update -R $env:GITHUB_REPOSITORY"
          }

      - name: Upload the captured submission
        if: env.MODE == 'get'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ms-store-metadata
          path: capture/metadata.json
          if-no-files-found: error
          retention-days: 1

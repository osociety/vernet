name: Deploy Firebase Hosting

# Live content only changes after the browser suite in firebase/e2e/ has passed
# against a preview channel of the same bytes, so a missing site asset or an
# unregistered-domain link cannot reach vernet-app.web.app. The steps below are
# deliberately one job: promotion sits after the suite in step order, so it is
# skipped by a red run without needing a cross-job condition.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_ENTRY_POINT: firebase
  FIREBASE_PROJECT_ID: vernet-app
  HOSTING_PREVIEW_CHANNEL: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    name: Verify and publish Firebase Hosting site
    timeout-minutes: 20
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VERNET_APP }}
        run: |
          set -euo pipefail

          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_VERNET_APP is empty or unavailable to this workflow."
            exit 1
          fi

          if ! jq -e '(.type == "service_account") and (.client_email | type == "string") and (.private_key | type == "string")' \
            <<< "$FIREBASE_SERVICE_ACCOUNT" >/dev/null; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_VERNET_APP is not a valid vernet-app service-account JSON key."
            exit 1
          fi

          # RUNNER_TEMP, not ${{ runner.temp }}: the runner context is not
          # readable in an env: block, only inside a step. Publishing the path
          # through GITHUB_ENV keeps firebase-tools' application default
          # credentials pointed at it for every later step, including the
          # always() cleanup.
          key_file="$RUNNER_TEMP/firebase-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key_file"
          chmod 600 "$key_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/e2e/package-lock.json

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13

      - name: Install site e2e dependencies
        working-directory: firebase/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: firebase/e2e
        run: npx playwright install --with-deps chromium

      - name: Deploy preview channel
        id: preview
        run: echo "url=$(./scripts/ci/firebase_site_channel.sh deploy 60m)" >> "$GITHUB_OUTPUT"

      - name: Wait for preview channel to serve
        run: ./scripts/ci/firebase_site_channel.sh await "${{ steps.preview.outputs.url }}"

      - name: Run site e2e suite against preview
        id: verify-site
        working-directory: firebase/e2e
        env:
          SITE_URL: ${{ steps.preview.outputs.url }}
        run: npm test

      - name: Promote verified channel to live
        if: steps.verify-site.outcome == 'success'
        run: ./scripts/ci/firebase_site_channel.sh promote

      - name: Delete preview channel
        if: always()
        run: ./scripts/ci/firebase_site_channel.sh cleanup

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: firebase-site-e2e-report
          path: |
            firebase/e2e/playwright-report/
            firebase/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

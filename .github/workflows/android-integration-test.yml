name: Android Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration-test:
    name: Android integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache pub dependencies
        uses: actions/cache@v4.2.2
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Run Android integration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-window -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 0
            flutter test integration_test/app_test.dart --flavor fdroid &
            test_pid=$!
            
            for attempt in $(seq 1 60); do
              if adb shell pm list packages | grep -q 'org.fsociety.vernet'; then
                break
              fi
              sleep 5
            done
            
            adb shell pm grant org.fsociety.vernet android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant org.fsociety.vernet android.permission.ACCESS_COARSE_LOCATION || true
            adb shell settings put secure location_mode 3
            wait "$test_pid"
name: Android Integration Tests

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: android-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration-test:
    name: Android integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5
        
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-default

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          java_version: '17'

      - name: Android Emulator Runner
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-window -no-boot-anim -camera-back none
          disable-animations: true
          script: chmod +x ./android_integration && ./android_integration
name: Android Integration Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration-test:
    name: Android integration tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest

    # The flavor is what these legs differ on. `flutter test --flavor` makes
    # flutter_tools define FLUTTER_APP_FLAVOR, so lib/values/build_flavor.dart
    # folds per leg and the fdroid and store branches are really built and run.
    # No unit test can reach them: --dart-define of that name is rejected as a
    # reserved tool define.
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, fdroid, store]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5
        
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-default

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          java_version: '17'

      # Unit tests are flavor independent, so one leg runs them for the matrix.
      - name: Run unit tests
        if: matrix.flavor == 'dev'
        run: flutter test

      - name: Android Emulator Runner
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-window -no-boot-anim -camera-back none
          disable-animations: true
          # The store leg builds the committed tree, so lib/store/ holds the
          # inert seam: this leg proves the gating, not AdMob itself. The real
          # SDK is only ever spliced in by scripts/build_store.dart, and
          # release-android verifies the resulting bundle by its contents.
          script: chmod +x ./scripts/android_integration && ./scripts/android_integration ${{ matrix.flavor }}

name: Android Integration Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration-test:
    name: Android integration tests (${{ matrix.flavor }})
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # The flavor is what these legs differ on. `flutter test --flavor` makes
    # flutter_tools define FLUTTER_APP_FLAVOR, so lib/values/build_flavor.dart
    # folds per leg and the fdroid and store branches are really built and run.
    # No unit test can reach them: --dart-define of that name is rejected as a
    # reserved tool define.
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, fdroid, store]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5
        
      # No AVD cache step here, deliberately, even though the action's README
      # recommends one. This workflow runs with `permissions: contents: read`,
      # and saving a cache needs actions: write, so every run logged
      # "Cache is read-only: will not save state" and the next run reported
      # "Cache not found for input keys: avd-default" - the key never changes
      # and nothing was ever written under it. The step could only ever miss,
      # while the action creates the AVD from scratch anyway (emulator-options
      # passes -no-snapshot-load). Re-add it only together with actions: write
      # and a snapshot-generating first leg.

      - name: Bootstrap Flutter
        uses: ./.github/actions/flutter-bootstrap
        with:
          java_version: '17'

      # Built here, while no emulator exists, rather than inside the leg script.
      # The build is the memory and CPU spike of this job — pub get, Gradle, the
      # NDK and CMake downloads — and doing it before the device boots keeps it
      # off the clock the suite runs on. scripts/android_integration installs the
      # result and only rebuilds if the APK is missing, so a local run of that
      # script still works.
      - name: Build flavored APK
        run: flutter build apk --debug --flavor ${{ matrix.flavor }}

      # Unit tests are flavor independent, so one leg runs them for the matrix.
      - name: Run unit tests
        if: matrix.flavor == 'dev'
        run: flutter test

      - name: Android Emulator Runner
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          # The action installs the emulator with `sdkmanager --install
          # emulator`, so this binary is whatever is newest on the stable
          # channel and it moved under us. Legs on 37.2.13 (build 16740729) ran
          # the suite for 3.5 minutes and reported 74 passing; every leg on
          # 37.3.10 (16970787) loses the device ~25s into the first test - adb
          # calls return `device offline` and the action's `adb emu kill` then
          # gets `connection refused` on 5554, so the emulator process is gone.
          # Nothing in the app or the harness changed between those dates, so
          # the pin holds the channel's churn out of the result. Drop it once a
          # 37.3.x build is proven here.
          emulator-build: '16740729'
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-window -no-boot-anim -camera-back none
          disable-animations: true
          # The store leg builds the committed tree, so lib/store/ holds the
          # inert seam: this leg proves the gating, not AdMob itself. The real
          # SDK is only ever spliced in by scripts/build_store.dart, and
          # release-android verifies the resulting bundle by its contents.
          script: chmod +x ./scripts/android_integration && ./scripts/android_integration ${{ matrix.flavor }}

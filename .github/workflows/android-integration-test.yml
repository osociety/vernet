name: Android Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration-test:
    name: Android integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5
        
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-default

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Flutter pub get
        run: flutter pub get
      
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Run Android integration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        working-directory: ./android
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-window -no-boot-anim -camera-back none
          disable-animations: true
          script: chmod +x ./android_integration && ./android_integration
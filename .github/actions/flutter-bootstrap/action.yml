name: Flutter bootstrap
description: Set up Flutter, cache dependencies, and run generated code.

inputs:
  java_version:
    description: Java version to install, or empty to skip Java setup.
    required: false
    default: ''
  architecture:
    description: x64 or arm64. Empty means detect from the runner.
    required: false
    default: ''
  arm64_flutter_ref:
    description: Branch or tag of flutter/flutter to clone on arm64.
    required: false
    default: master

runs:
  using: composite
  steps:
    - name: Setup Java
      if: ${{ inputs.java_version != '' }}
      uses: actions/setup-java@v4.7.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - name: Resolve architecture
      id: arch
      shell: bash
      env:
        INPUT_ARCH: ${{ inputs.architecture }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        arch="${INPUT_ARCH:-$RUNNER_ARCH_NAME}"
        arch="$(echo "$arch" | tr '[:upper:]' '[:lower:]')"
        case "$arch" in
          x64|x86_64|amd64) arch=x64 ;;
          arm64|aarch64)    arch=arm64 ;;
          *) echo "Unsupported architecture: $arch"; exit 1 ;;
        esac
        echo "value=$arch" >> "$GITHUB_OUTPUT"

    - name: Setup Flutter (x64)
      if: ${{ steps.arch.outputs.value == 'x64' }}
      uses: subosito/flutter-action@v2.23.0
      with:
        channel: stable
        architecture: x64
        cache: true

    - name: Clone Flutter (arm64)
      if: ${{ steps.arch.outputs.value == 'arm64' }}
      shell: bash
      env:
        FLUTTER_REF: ${{ inputs.arm64_flutter_ref }}
      run: |
        FLUTTER_DIR="$RUNNER_TEMP/flutter"
        git clone --depth 1 --branch "$FLUTTER_REF" https://github.com/flutter/flutter.git "$FLUTTER_DIR"
        if command -v cygpath >/dev/null 2>&1; then
          echo "$(cygpath -w "$FLUTTER_DIR")\\bin" >> "$GITHUB_PATH"
        else
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
        fi

    - name: Flutter doctor (arm64)
      if: ${{ steps.arch.outputs.value == 'arm64' }}
      shell: bash
      run: |
        flutter config --no-analytics
        flutter doctor -v
        flutter --version

    - name: Download dependencies
      run: flutter pub get
      shell: bash

    - name: Run build_runner
      run: dart run build_runner build --delete-conflicting-outputs
      shell: bash
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '9.0.1' apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// AGP 9 resolves the default ProGuard files eagerly from the project layout,
// so the build directory must be set before any project is evaluated.
gradle.beforeProject { project ->
    project.layout.buildDirectory = project == project.rootProject
        ? file("../build")
        : file("../build/${project.name}")
}

dependencyResolutionManagement{
    repositories{
        maven { url "https://jitpack.io" }
    }
}
include ":app"

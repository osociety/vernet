# lint analysis
include: package:lint/analysis_options.yaml

analyzer:
  errors:
    depend_on_referenced_packages: ignore
    missing_required_param: error
    missing_return: error
    must_be_immutable: error
    # Flutter 3.50 deprecated the material.dart and cupertino.dart umbrella
    # imports, so every widget file reports this: 104 + 9 infos, and those 113
    # were the complete issue list. Warnings and errors stay fatal in CI and in
    # the pre-commit hook, so a real regression still fails the build.
    deprecated_member_use: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.pb.dart"
    - "**/*.pbenum.dart"
    - "**/*.pbgrpc.dart"
    - "**/*.pbjson.dart"
    - "**/*.gr.dart"
    - "**/*.config.dart"
    - build/**
    # Store-only AdMob and InAppReview code, copied over lib/store/ by
    # scripts/build_store.dart. Its SDKs are not dependencies of a normal
    # build, so analyzing it here would fail on unresolvable imports.
    - store_overlay/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**


linter:
  rules:
    # Use parameter order as in json response
    #    always_put_required_named_parameters_first: false

    avoid_classes_with_only_static_members: false

    sort_constructors_first: true

    # Good packages document everything
    public_member_api_docs: false
    avoid_dynamic_calls: false
    use_build_context_synchronously: false
    avoid_positional_boolean_parameters: false

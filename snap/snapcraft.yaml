name: vernet
version: 0.1.0
summary: Vernet - Know your network
description: Know your network. Discover, scan & diagnose.

confinement: strict
base: core22
grade: stable

slots:
  dbus-vernet:
    interface: dbus
    bus: session
    name: org.fsociety.vernet

apps:
  vernet:
    command: vernet
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-vernet
parts:
  vernet:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    # Override build to run build_runner first, then proceed
    override-build: |
      # 1. Run pub get using the exact path to Flutter
      $CRAFT_PART_SRC/flutter/bin/flutter pub get
      
      # 2. Run build_runner via Dart
      $CRAFT_PART_SRC/flutter/bin/cache/dart-sdk/bin/dart run build_runner build --delete-conflicting-outputs
      
      # 3. Build the Linux binary
      $CRAFT_PART_SRC/flutter/bin/flutter build linux --release --target lib/main.dart
      
      # 4. Copy build files to the install directory
      mkdir -p $CRAFT_PART_INSTALL
      cp -r build/linux/x64/release/bundle/* $CRAFT_PART_INSTALL/

name: vernet
version: 0.1.0
summary: Vernet - Know your network
description: Know your network. Discover, scan & diagnose.

confinement: strict
base: core22
grade: stable

slots:
  dbus-vernet:
    interface: dbus
    bus: session
    name: org.fsociety.vernet

apps:
  vernet:
    command: vernet
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-vernet
parts:
  vernet:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    # Override build to run build_runner first, then proceed
    override-build: |
      # 1. Run the default plugin steps (clones flutter, fetches pub packages)
      craftctl default
      
      # 2. Assign the actual Flutter path generated by the plugin
      export FLUTTER_BIN="$CRAFT_PART_BUILD/flutter-distro/bin/flutter"
      export DART_BIN="$CRAFT_PART_BUILD/flutter-distro/bin/cache/dart-sdk/bin/dart"
      
      # 3. Run build runner inside your project root
      $DART_BIN run build_runner build --delete-conflicting-outputs
      
      # 4. Rebuild the bundle to include the newly generated code
      $FLUTTER_BIN build linux --release --target lib/main.dart
      
      # 5. Overwrite the final installation package with your new generated build
      cp -r build/linux/arm64/release/bundle/* $CRAFT_PART_INSTALL/
